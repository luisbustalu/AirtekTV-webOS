name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli@3.2.3

      - name: Read app version
        id: app
        run: |
          version="$(node -p "require('./appinfo.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Package ipk
        run: |
          ares-package . -o dist \
            -e "README.md" \
            -e "LICENSE.md" \
            -e ".github" \
            -e ".git"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.app.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Airtek TV ${{ steps.app.outputs.version }}
          make_latest: "true"
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/*.ipk
          body: |
            Paquete de Airtek TV ${{ steps.app.outputs.version }} para webOS.

            El televisor tiene que tener el modo de desarrollador activado. Instala el archivo `.ipk` adjunto con [webOS Dev Manager](https://github.com/webosbrew/dev-manager-desktop/releases/latest).

            1. En el televisor, instala **Developer Mode** desde LG Content Store, activa el modo de desarrollador y deja el servidor de claves encendido.
            2. En el computador, instala webOS Dev Manager, agrega el televisor con la dirección IP y la frase de acceso. El puerto es `9922`.
            3. Descarga el `.ipk` de esta versión, selecciona el televisor, elige **Instalar** (el botón dice Install) y abre el archivo.

            Las instrucciones completas están en el [README](https://github.com/${{ github.repository }}/blob/HEAD/README.md).
