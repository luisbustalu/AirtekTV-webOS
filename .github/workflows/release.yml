name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli@3.2.3

      - name: Read app version
        id: app
        run: |
          version="$(node -p "require('./appinfo.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Package ipk
        run: |
          ares-package . -o dist \
            -e "README.md" \
            -e "LICENSE.md" \
            -e ".github" \
            -e ".git"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.app.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Airtek TV ${{ steps.app.outputs.version }}
          make_latest: "true"
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: dist/*.ipk
          body: |
            webOS package for Airtek TV ${{ steps.app.outputs.version }}.

            Enable Developer Mode on the TV, then install the attached `.ipk` with [webOS Dev Manager](https://github.com/webosbrew/dev-manager-desktop/releases/latest).
